<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Entregas</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Entregas">
<meta name="theme-color" content="#1C1C1E">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  :root{--fundo:#000;--texto:#fff;--texto2:#9A9A9F;--linha:#1F1F22;--painel:#1C1C1E;--tecla:#2C2C2E;--tecla2:#3A3A3C;--verde:#30C75E;--erro:#FF5A4F;color-scheme:dark}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--fundo);color:var(--texto);min-height:100vh}
  header{background:var(--painel);color:var(--texto);padding:calc(18px + env(safe-area-inset-top)) 20px 20px}
  header h1{font-size:15px;font-weight:600;opacity:.75}
  .placar{font-size:44px;font-weight:800;letter-spacing:-1.5px;line-height:1.1;margin-top:4px}
  .placar small{font-size:20px;font-weight:600;letter-spacing:0;opacity:.6}
  .barra{height:6px;background:var(--tecla2);border-radius:3px;margin-top:14px;overflow:hidden}
  .barra i{display:block;height:100%;width:0;background:var(--verde);transition:width .4s}
  main{padding:0 0 calc(110px + env(safe-area-inset-bottom))}
  .secao{display:flex;justify-content:space-between;align-items:baseline;padding:22px 20px 6px}
  h2{font-size:14px;font-weight:600;color:var(--texto2)}
  .link{background:none;border:none;font:inherit;font-size:14px;color:var(--texto2);text-decoration:underline;cursor:pointer;padding:6px 0 6px 10px}
  .entrega{display:flex;align-items:center;gap:14px;padding:16px 20px;border-bottom:1px solid var(--linha)}
  .info{flex:1;min-width:0;cursor:pointer}
  .nome{font-size:19px;font-weight:700}
  .end{display:inline-block;font-size:15px;color:var(--texto);margin-top:3px;text-decoration:underline;text-decoration-color:#555;text-underline-offset:3px}
  .itens{font-size:14px;color:var(--texto2);margin-top:5px;white-space:pre-line}
  .check{flex:none;width:58px;height:58px;border-radius:50%;border:3px solid var(--texto);background:var(--fundo);display:grid;place-items:center;cursor:pointer}
  .check svg{width:26px;height:26px;stroke:var(--texto);opacity:.25}
  .check:active{background:var(--tecla)}
  .feita .nome{text-decoration:line-through;color:var(--texto2)}
  .feita .hora{font-size:13px;color:var(--verde);margin-top:3px;font-weight:600}
  .vazio{padding:24px 20px;font-size:16px;color:var(--texto2)}
  .nova{position:fixed;left:20px;right:20px;bottom:calc(20px + env(safe-area-inset-bottom));height:58px;border:none;border-radius:16px;background:var(--texto);color:var(--fundo);font:inherit;font-size:18px;font-weight:700;cursor:pointer}

  .fundo{position:fixed;inset:0;background:rgba(0,0,0,.65);opacity:0;pointer-events:none;transition:opacity .2s;z-index:10}
  .fundo.aberto{opacity:1;pointer-events:auto}
  .folha{position:fixed;left:0;right:0;bottom:0;background:var(--painel);border-radius:22px 22px 0 0;padding:22px 20px calc(18px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .25s ease-out;max-height:92vh;overflow:auto}
  .fundo.aberto .folha{transform:none}
  .folha p{font-size:15px;color:var(--texto2);text-align:center}
  .folha h3{font-size:22px;font-weight:800;text-align:center;margin-top:2px}
  .digitos{display:flex;justify-content:center;gap:12px;margin:22px 0 8px}
  .digitos span{width:54px;height:64px;border:2px solid var(--tecla2);border-radius:12px;display:grid;place-items:center;font-size:30px;font-weight:700}
  .digitos span.cheio{border-color:var(--texto)}
  .digitos.errado span{border-color:var(--erro);color:var(--erro)}
  .digitos.errado{animation:tremer .35s}
  .digitos.certo span{border-color:var(--verde);background:var(--verde);color:#000}
  @keyframes tremer{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
  .aviso{min-height:20px;text-align:center;font-size:14px;font-weight:600;color:var(--erro)}
  .teclado{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
  .teclado button{height:58px;border:none;border-radius:12px;background:var(--tecla);font:inherit;font-size:26px;font-weight:600;color:var(--texto);cursor:pointer}
  .teclado button:active{background:var(--tecla2)}
  .teclado .tvazia{background:none}
  .cancelar{display:block;width:100%;margin-top:10px;background:none;border:none;font:inherit;font-size:16px;color:var(--texto2);padding:12px;cursor:pointer}

  form label{display:block;font-size:14px;font-weight:600;color:var(--texto2);margin:16px 0 6px}
  form input,form textarea{width:100%;font:inherit;font-size:17px;padding:13px 14px;border:2px solid var(--tecla2);border-radius:12px;background:var(--tecla);color:var(--texto)}
  form input:focus,form textarea:focus{outline:none;border-color:var(--texto)}
  form textarea{min-height:76px;resize:vertical}
  .salvar{width:100%;height:56px;margin-top:22px;border:none;border-radius:14px;background:var(--texto);color:var(--fundo);font:inherit;font-size:18px;font-weight:700;cursor:pointer}
  .excluir{display:block;width:100%;margin-top:6px;background:none;border:none;font:inherit;font-size:16px;color:var(--erro);padding:12px;cursor:pointer}
  button:focus-visible{outline:3px solid #6aa0ff;outline-offset:2px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header>
  <h1>Entregas</h1>
  <div class="placar" id="placar">…</div>
  <div class="barra"><i id="barra"></i></div>
</header>
<main>
  <div class="secao"><h2>A entregar</h2></div>
  <div id="pendentes"></div>
  <div class="secao"><h2>Entregues</h2><button class="link" id="limpar" hidden>Limpar entregues</button></div>
  <div id="feitas"></div>
</main>
<button class="nova" id="nova">Nova entrega</button>

<!-- código -->
<div class="fundo" id="fundoCodigo">
  <div class="folha" role="dialog" aria-modal="true" aria-labelledby="codNome">
    <p>Código de entrega para</p>
    <h3 id="codNome"></h3>
    <div class="digitos" id="digitos"><span></span><span></span><span></span><span></span></div>
    <div class="aviso" id="aviso"></div>
    <div class="teclado" id="teclado"></div>
    <button class="cancelar" data-fechar>Cancelar</button>
  </div>
</div>

<!-- cadastro -->
<div class="fundo" id="fundoForm">
  <div class="folha" role="dialog" aria-modal="true" aria-labelledby="formTitulo">
    <h3 id="formTitulo">Nova entrega</h3>
    <form id="form" autocomplete="off">
      <label for="fNome">Cliente</label>
      <input id="fNome" required>
      <label for="fEnd">Endereço</label>
      <input id="fEnd">
      <label for="fItens">Itens</label>
      <textarea id="fItens"></textarea>
      <button class="salvar" type="submit">Salvar entrega</button>
    </form>
    <button class="excluir" id="excluir" hidden>Excluir entrega</button>
    <button class="cancelar" data-fechar>Cancelar</button>
  </div>
</div>

<script>
const CODIGO = "0309";
const CHAVE = "entregas-v1";
let entregas = [];
let atual = null, editando = null, digitado = "";

const $ = id => document.getElementById(id);
const esc = s => String(s||"").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const quando = iso => { const d = new Date(iso), hoje = new Date().toDateString();
  const h = d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
  return d.toDateString()===hoje ? `hoje às ${h}` : `${d.toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"})} às ${h}`; };
const mapa = e => "comgooglemaps://?q=" + encodeURIComponent(e + ", Rio de Janeiro");
const svgCheck = '<svg viewBox="0 0 24 24" fill="none" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg>';

function carregar(){
  try { entregas = JSON.parse(localStorage.getItem(CHAVE) || "[]"); } catch(e){ entregas = []; }
  desenhar();
}
function salvar(){
  try { localStorage.setItem(CHAVE, JSON.stringify(entregas)); } catch(e){ alert("Não consegui salvar no celular."); }
}

function desenhar(){
  const pend = entregas.filter(e=>!e.feita);
  const feitas = entregas.filter(e=>e.feita).sort((a,b)=>b.feita.localeCompare(a.feita));
  $("placar").innerHTML = entregas.length ? `${feitas.length} <small>de ${entregas.length} entregues</small>` : `0 <small>entregas na lista</small>`;
  $("barra").style.width = entregas.length ? (feitas.length/entregas.length*100)+"%" : "0";
  $("limpar").hidden = !feitas.length;

  $("pendentes").innerHTML = pend.length ? pend.map(e=>`
    <div class="entrega">
      <div class="info" data-editar="${e.id}">
        <div class="nome">${esc(e.nome)}</div>
        ${e.end ? `<a class="end" href="${mapa(e.end)}">${esc(e.end)}</a>` : ""}
        ${e.itens ? `<div class="itens">${esc(e.itens)}</div>` : ""}
      </div>
      <button class="check" data-check="${e.id}" aria-label="Marcar entrega de ${esc(e.nome)}">${svgCheck}</button>
    </div>`).join("")
    : `<div class="vazio">${entregas.length ? "Tudo entregue." : "Toque em Nova entrega para montar a rota."}</div>`;

  $("feitas").innerHTML = feitas.length ? feitas.map(e=>`
    <div class="entrega feita">
      <div class="info">
        <div class="nome">${esc(e.nome)}</div>
        <div class="hora">Entregue ${quando(e.feita)}</div>
      </div>
      <button class="link" data-desfazer="${e.id}">Desfazer</button>
    </div>`).join("") : `<div class="vazio">Nenhuma ainda.</div>`;
}

/* código de entrega */
function abrirCodigo(id){
  atual = entregas.find(e=>e.id===id); digitado = "";
  $("codNome").textContent = atual.nome;
  $("aviso").textContent = ""; $("digitos").className = "digitos";
  mostrarDigitos(); $("fundoCodigo").classList.add("aberto");
}
function mostrarDigitos(){
  [...$("digitos").children].forEach((s,i)=>{ s.textContent = digitado[i]||""; s.classList.toggle("cheio", i<digitado.length); });
}
function tecla(t){
  if(!atual || $("digitos").classList.contains("certo")) return;
  $("digitos").className = "digitos"; $("aviso").textContent = "";
  if(t==="⌫") digitado = digitado.slice(0,-1); else if(digitado.length<4) digitado += t;
  mostrarDigitos();
  if(digitado.length<4) return;
  if(digitado===CODIGO){
    $("digitos").classList.add("certo");
    if(navigator.vibrate) navigator.vibrate(40);
    const e = atual;
    setTimeout(()=>{ e.feita = new Date().toISOString(); fecharTudo(); desenhar(); salvar(); }, 450);
  } else {
    $("digitos").classList.add("errado"); $("aviso").textContent = "Código errado. Tente de novo.";
    digitado = ""; setTimeout(mostrarDigitos, 350);
  }
}
$("teclado").innerHTML = ["1","2","3","4","5","6","7","8","9","","0","⌫"].map(t => t
  ? `<button type="button" data-t="${t}" aria-label="${t==="⌫"?"Apagar":t}">${t}</button>`
  : `<button type="button" class="tvazia" tabindex="-1" aria-hidden="true"></button>`).join("");
$("teclado").onclick = ev => { const b = ev.target.closest("[data-t]"); if(b) tecla(b.dataset.t); };

/* cadastro e edição */
function abrirForm(id){
  editando = id ? entregas.find(e=>e.id===id) : null;
  $("formTitulo").textContent = editando ? "Editar entrega" : "Nova entrega";
  $("fNome").value = editando?.nome || ""; $("fEnd").value = editando?.end || ""; $("fItens").value = editando?.itens || "";
  $("excluir").hidden = !editando;
  $("fundoForm").classList.add("aberto");
  setTimeout(()=>$("fNome").focus(), 260);
}
$("form").onsubmit = ev => {
  ev.preventDefault();
  const dados = { nome: $("fNome").value.trim(), end: $("fEnd").value.trim(), itens: $("fItens").value.trim() };
  if(!dados.nome) return;
  if(editando) Object.assign(editando, dados);
  else entregas.push({ id: Date.now().toString(36), ...dados, feita: null });
  fecharTudo(); desenhar(); salvar();
};
$("excluir").onclick = () => {
  if(!confirm(`Excluir a entrega de ${editando.nome}?`)) return;
  entregas = entregas.filter(e=>e!==editando); fecharTudo(); desenhar(); salvar();
};

function fecharTudo(){ document.querySelectorAll(".fundo").forEach(f=>f.classList.remove("aberto")); atual = null; editando = null; document.activeElement?.blur(); }
document.querySelectorAll("[data-fechar]").forEach(b => b.onclick = fecharTudo);
document.querySelectorAll(".fundo").forEach(f => f.onclick = ev => { if(ev.target===f) fecharTudo(); });
$("nova").onclick = () => abrirForm(null);
$("limpar").onclick = () => {
  if(!confirm("Tirar da lista todas as entregas já feitas?")) return;
  entregas = entregas.filter(e=>!e.feita); desenhar(); salvar();
};
document.body.addEventListener("click", ev => {
  if(ev.target.closest("a")) return;
  const c = ev.target.closest("[data-check]"); if(c) return abrirCodigo(c.dataset.check);
  const ed = ev.target.closest("[data-editar]"); if(ed) return abrirForm(ed.dataset.editar);
  const d = ev.target.closest("[data-desfazer]");
  if(d){ const e = entregas.find(x=>x.id===d.dataset.desfazer); e.feita = null; desenhar(); salvar(); }
});
document.addEventListener("keydown", ev => {
  if(ev.key==="Escape") return fecharTudo();
  if(!atual) return;
  if(/^\d$/.test(ev.key)) tecla(ev.key); else if(ev.key==="Backspace") tecla("⌫");
});

carregar();
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
</script>
</body>
</html>
